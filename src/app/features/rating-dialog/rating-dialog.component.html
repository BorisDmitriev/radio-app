<div class="rating-dialog">
    <h2 class="heading">Bewertung abgeben</h2>
    <div class="stars">
        <button
            type="button"
            class="star-button"
            *ngFor="let star of [1, 2, 3, 4, 5]"
            (click)="setRating(star)"
            [class.filled]="star <= rating" 
        >
            <span class="star">★</span>
        </button>
    </div>
    <textarea
        id="comment"
        [(ngModel)]="comment"
        placeholder="Schreibe einen Kommentar"
    ></textarea>

    <div class="dialog-buttons">
        <button type="button" class="cancel-button" (click)="close()">Abbrechen</button>
        <button type="button" class="submit-button" (click)="submit()" [disabled]="rating === 0">Absenden</button>
    </div>
</div>
